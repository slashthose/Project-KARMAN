<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sign in to your KARMAN career workspace.">
<link rel="icon" href="images/favicon_badge.png" type="image/png">
<title>Sign In — KARMAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="auth-split-wrapper">
    <!-- LEFT SIDE: FULL HEIGHT ARTWORK -->
    <div class="auth-split-visual">
      <img src="images/login_art.png" alt="Rural Learners & Skilling Community">
      <div class="auth-visual-badge">
        <h4>Project KARMAN</h4>
        <p>Voice-First AI & Career Intelligence for every student, artisan, and informal worker across India.</p>
      </div>
    </div>

    <!-- RIGHT SIDE: LOGIN FORM -->
    <div class="auth-split-content">
      <div class="auth-box">
        <div class="auth-header">
          <a href="index.html" title="Project KARMAN Home">
            <img src="images/karman_logo_clean.png" alt="KARMAN" class="auth-header-logo">
          </a>
          <h1>Log into your account</h1>
          <p>Access your career workspace, schemes & skills</p>
        </div>

        <button type="button" class="btn-social-pill" onclick="quickDemoAccess('student')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.4C.5 8.3 0 10.1 0 12s.5 3.7 1.4 5.4z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.7l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.6l4 3.1c.9-2.8 3.5-4.9 6.6-4.9z"/></svg>
          ⚡ Fast Demo: Arjun Mehta (Student)
        </button>

        <button type="button" class="btn-social-pill" onclick="quickDemoAccess('worker')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          ⚡ Fast Demo: Sunita Devi (Worker)
        </button>

        <div class="auth-or-divider">OR</div>

        <form id="login-form" onsubmit="return handleLogin(event)">
          <div class="auth-field">
            <label for="login-email">Email Address</label>
            <input id="login-email" class="auth-input-pill" type="email" placeholder="e.g., arjun@karman.gov.in" value="arjun@karman.gov.in" required>
          </div>
          <div class="auth-field">
            <label for="login-pass">Password</label>
            <input id="login-pass" class="auth-input-pill" type="password" placeholder="••••••••" value="password123" required>
          </div>

          <div class="auth-row-between">
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
              <input type="checkbox" checked> Remember me
            </label>
            <a href="#" onclick="alert('Password reset link sent to registered email.')" style="color:var(--blue-text); font-weight:600;">Forgot password?</a>
          </div>

          <button type="submit" class="btn-auth-submit primary-navy">Continue →</button>
        </form>

        <p class="auth-footer-note">Don't have an account? <a href="register.html">Create one</a></p>
        <div class="auth-footer-back"><a href="index.html">← Back to home</a></div>
      </div>
    </div>
  </div>

<script src="api.js"></script>
<script src="auth.js"></script>
</body>
</html>
